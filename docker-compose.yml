services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  # One-shot schema migration. Runs to completion before the backend starts, so
  # a fresh database is at head on first boot. Kept separate from the app
  # process so scaling the backend cannot run concurrent migrations.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/skinaibot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/skinaibot
      - AI_SERVICE_URL=http://ai-service:8001
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - UPLOAD_DIR=/app/backend/uploads
      # Base for URLs the backend hands out for its own stored images. The AI
      # service fetches them server-side, so this must resolve on the Compose
      # network - "localhost" there is the AI container itself, not the backend.
      - PUBLIC_BASE_URL=http://backend:8000
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      ai-service:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ai-service:
    build:
      context: ./ai/service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - LLM_PROVIDER=openai

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=skinaibot
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The migrate service connects as soon as it starts, so wait for Postgres
    # to actually accept connections rather than just for the container to run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d skinaibot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  uploads:
