version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/skinaibot
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      - ai-service
      - postgres

  ai-service:
    build:
      context: ./ai/service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - LLM_PROVIDER=openai

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=skinaibot
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
